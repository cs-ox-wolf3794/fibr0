name: pipeline

# Three digest slots per trading day in US Eastern time: 07:30, 12:30, 17:00.
# GitHub cron is UTC and ignores DST, so each slot is scheduled at both its EDT
# and EST UTC offset. The pipeline computes the slot from the current ET time and
# exits cleanly when the trigger does not fall inside a slot window.
# Weekends and NYSE holidays: only the 17:00 ET slot runs (handled in code).
on:
  schedule:
    - cron: "30 11 * * *"   # 07:30 EDT
    - cron: "30 12 * * *"   # 07:30 EST
    - cron: "30 16 * * *"   # 12:30 EDT
    - cron: "30 17 * * *"   # 12:30 EST
    - cron: "0 21 * * *"    # 17:00 EDT
    - cron: "0 22 * * *"    # 17:00 EST
  workflow_dispatch:
    inputs:
      slot:
        description: "Force a slot (auto, pre_open, midday, post_close)"
        default: "auto"
      stage:
        description: "Stage to run (all, ingest, filter, cluster, analyze, score, publish)"
        default: "all"
      dry_run:
        description: "Skip LLM calls and writes"
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e .
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIBR0_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: >
          fibr0 run
          --stage "${{ inputs.stage || 'all' }}"
          --slot "${{ inputs.slot || 'auto' }}"
